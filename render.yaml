services:
  - type: web
    name: cricket-scorer
    env: node
    plan: free
    region: oregon
    branch: claude/cricket-scoring-app-FjJPG
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cricket-db
          property: connectionString
      # Mail (Resend HTTP API) for the v3 "Send invite" button. Render's
      # free tier blocks outbound SMTP, so we use HTTPS-based Resend.
      # Set RESEND_API_KEY manually in the Render dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "onboarding@resend.dev"
      - key: MAIL_FROM_NAME
        value: "Cricket Scorer"

databases:
  - name: cricket-db
    plan: free
    region: oregon
