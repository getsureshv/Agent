services:
  - type: web
    name: cricket-scorer
    env: node
    plan: free
    region: oregon
    branch: claude/cricket-scoring-app-FjJPG
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cricket-db
          property: connectionString
      # SMTP (Gmail) for the v3 "Send invite" button. Set manually in the
      # Render dashboard — see README "Email (optional)" for the steps.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: "Cricket Scorer"

databases:
  - name: cricket-db
    plan: free
    region: oregon
